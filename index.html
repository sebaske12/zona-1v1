<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d111d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zona 1v1" />
    <title>Zona 1v1</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237ea0ff' stroke-width='3' stroke-dasharray='5 4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff4f8b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d111d; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      input { -webkit-user-select: text; user-select: text; }
      /* El juego ocupa toda la pantalla menos las zonas que tapa el iPhone (la muesca y la rayita de abajo) */
      #juego { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      /* En el celular vertical se pide girarlo */
      #girar { display: none; position: fixed; inset: 0; z-index: 10; background: #0d111d; color: #e7eaf2;
        font: 600 22px "Chakra Petch", system-ui, sans-serif; align-items: center; justify-content: center;
        flex-direction: column; gap: 12px; text-align: center; padding: 24px; }
      #girar span { font-size: 56px; }
      @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
    </style>
  </head>
  <body>
    <div id="girar"><span>↻</span>Gira el celular para jugar</div>
    <div id="juego"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
